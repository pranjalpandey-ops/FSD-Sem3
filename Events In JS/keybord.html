<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: rgb(217, 245, 237);
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif
    }
    #form{



        
        width:300px;
        margin: 100px auto 0 auto;
        border: 2px solid rgb(47, 44, 44);
        padding: 25px;
        background-color: rgb(153, 198, 212);
        color: rgb(38, 38, 42);
        box-shadow: 3px 3px 10px #000;  
        padding: 3rem;
        border-radius: 20px;
    }
    p,input{
        font-size: 20px;
    }
    input{
        width: 300px;
        border: 1px solid #000;
        border-radius: 10px;
        background-color: #f7f8f1;
        box-shadow: 3px 3px 10px #000;
        height: 40px;
    }
    button{
        width: 300px;
        height: 40px;
        background-color: black;
        color: white;
        border-radius: 10px;
        margin-top: 30px;
    }
</style>
<body>
    <div id="form">
        <h1 id="h1"> Keybord Events</h1>
        <p>onkeydown</p>
        <input type="text" onkeydown="document.getElementById('form').style.background = this.value">
        <p>onkeyup</p>
        <input type="text" onkeyup="document.getElementById('form').style.background = this.value">
        <p>onkeypress</p>
        <input type="text" onkeypress= "document.getElementById('form').style.background = this.value">
    </div>
    <button onclick="ckl()">Change Color</button>
</body>
<script src="./keybord.js"></script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="script.css">
</head>
<body>
    <div class="box" id="start-screen">
        <h1>Quiz App</h1>
        <p>Enter your details to start</p>
        <input type="text" id="name" placeholder="Enter Name">
        <input type="text" id="roll" placeholder="Enter Roll Number">
        <input type="text" id="section" placeholder="Enter Section">
        <button onclick="startQuiz()">Start Quiz</button>
    </div>
    <div class="box quiz-box" id="quiz-screen">
        <h1>Quiz</h1>
        <p id="student-info"></p>
        <div class="timer">
            Time Left: <span id="time">60</span> seconds
        </div>
        <h2 id="question"></h2>
        <div id="options"></div>
        <button id="next" onclick="nextQuestion()">Next</button>
    </div>
    <div class="box" id="result-screen">
        <h1>Quiz Completed!</h1>
        <h2 id="final-score"></h2>
        <button onclick="location.reload()">Try Again</button>
    </div>
    <script src="script.js"></script>
</body>
</html>

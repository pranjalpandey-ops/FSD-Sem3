<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">

        <form >
            <h1>Student Registration</h1>
            <div class="name">
                <div>
                    <label for="fName">First Name:</label>
                    <input type="text" class="fName" placeholder="Enter First Name">
                </div>
                
                <div>
                    <label for="lName">Last Name:</label>
                    <input type="text" class="lName" placeholder="Enter Last Name">
                </div>
            </div>
            <div class="mailPh">
                <div>
                     <label for="email">Email Id:</label>
                    <input type="email" name="" id="" placeholder="Enter Email id">
                </div>
                <div>
                    <label for="phNo">Phone No</label>
                    <input type="tel" name="" id="" placeholder="Phone No">
                </div>

            </div>
            <div class="genBran">
                <div>
                    <label for="branch">Branch</label>
                    <select name="" id="">
                        <option value="">CSE</option>
                        <option value="">CSE AIML</option>
                        <option value="">CSE DS</option>
                        <option value="">ECE</option>
                        <option value="">ELCE</option>
                        <option value="">Electrical</option>
                    </select>
                </div>

                <div>
                     <label for="male">Male</label>
                    <input type="radio" name="" id="male" class="mail" >
                    <label for="fmale">Female</label>
                    <input type="radio" id="fmale" class="fmail">
                </div>  
            </div>
            
            <div>
                <button id="sub">Submit</button>
            </div>
        </form>
        <div class="list"></div>
    </div>

    <script src="./script.js"></script>


</body>
</html>

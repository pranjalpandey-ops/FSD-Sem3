<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Events </title>
    <style>
        #box{
            height: 300px;
            width: 300px;
            background-color: aqua;
            margin: 200px 0 0 100px;
            border :5px solid red;
        }
    </style>
    <script>
        let i =document.querySelector('div');
        i.innerText="Hello";
        function eventcall(){
            alert('These are the mouse event');

        }
    </script>
</head>
<body>
    <!--onclick="eventcall()"-->
    <!--onblclick="eventcall()"-->
    <!--onmouseover="eventcall()"-->
    <!--onmouseup="eventcall()"-->
    <!--onmousedown="eventcall()-->
    <div id="box" onmousedown="eventcall()">This is section A</div>
    
</body>
</html>
